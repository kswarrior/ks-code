name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: cd packages/sdk/js && bun run script/build.ts

      - name: Build for all platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "true"
          OPENCODE_VERSION: "0.0.0-manual-${{ github.run_id }}"
        run: |
          # Create a release
          RELEASE_TAG="v$OPENCODE_VERSION"
          gh release create "$RELEASE_TAG" --title "Manual Build $RELEASE_TAG" --notes "Automated multi-platform build" || true

          # Run the build script which will build and upload to the release
          cd packages/opencode
          bun run script/build.ts
